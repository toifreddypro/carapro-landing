// Valeur à écrire DANS un attribut HTML, p. ex. onclick="f(' + attrJs(x) + ')". escHtml ne suffit pas ici :
// il laisse passer les guillemets, ce qui permettait à un nom d'entreprise de refermer l'attribut et d'y
// ajouter son propre code. JSON protège la chaîne côté JavaScript, puis l'échappement HTML complet
// (& en premier, sinon un "&quot;" saisi par un utilisateur serait décodé en guillemet réel).
function attrJs(val) {
  return JSON.stringify(val == null ? '' : String(val))
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function slugify(s) {
  return String(s||'').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retire les accents
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// ── Quoi de neuf — annonces affichées une fois à chaque artisan, à sa connexion sur MPA ──
async function chargerNouveautes() {
  var { data: items, error } = await sb.from('nouveautes').select('*').order('created_at', { ascending: false });
  if (error) {
    document.getElementById('zone-nouveautes').innerHTML = '<p style="color:var(--danger);">Erreur nouveautés : ' + escHtml(error.message) + '</p>';
    return;
  }
  document.getElementById('zone-nouveautes').innerHTML =
    '<div class="dcard">' +
      '<div class="dchdr"><span>📣 Quoi de neuf (' + items.length + ')</span></div>' +
      '<div class="dcbdy"><table class="dtbl">' +
        '<thead><tr><th>Titre</th><th>Description</th><th>Visible</th><th></th></tr></thead>' +
        '<tbody>' + items.map(renderLigneNouveaute).join('') + '</tbody>' +
      '</table></div>' +
      '<div style="padding:14px 18px;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:8px;">' +
        '<input id="nouveaute-titre" type="text" placeholder="Titre (ex : Nouveau : le panier d\'achat !)" style="padding:8px 12px;border-radius:8px;border:1px solid var(--b2);font-family:\'Outfit\',sans-serif;font-size:13px;">' +
        '<textarea id="nouveaute-desc" rows="2" placeholder="Description courte, visible dans la bulle de l\'artisan…" style="padding:8px 12px;border-radius:8px;border:1px solid var(--b2);font-family:\'Outfit\',sans-serif;font-size:13px;resize:vertical;"></textarea>' +
        '<button onclick="ajouterNouveaute()" style="align-self:flex-start;padding:8px 16px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;">+ Publier</button>' +
      '</div>' +
      '<div class="note">💡 Chaque artisan voit les annonces publiées depuis sa dernière connexion, une seule fois, dans une bulle à l\'ouverture de MPA.</div>' +
    '</div>';
}

function renderLigneNouveaute(n) {
  return '<tr>' +
    '<td><strong>' + escHtml(n.titre) + '</strong></td>' +
    '<td style="color:var(--mu);font-size:12px;max-width:280px;">' + escHtml(n.description) + '</td>' +
    '<td><input type="checkbox" ' + (n.actif ? 'checked' : '') + ' onchange="basculerNouveaute(\'' + n.id + '\', this.checked)"></td>' +
    '<td><button class="btn-del" onclick="supprimerNouveaute(' + attrJs(n.id) + ',' + attrJs(n.titre) + ')">Supprimer</button></td>' +
  '</tr>';
}

async function ajouterNouveaute() {
  var titre = document.getElementById('nouveaute-titre').value.trim();
  var description = document.getElementById('nouveaute-desc').value.trim();
  if (!titre || !description) { alert('Titre et description sont nécessaires.'); return; }
  var { error } = await sb.from('nouveautes').insert({ titre: titre, description: description, actif: true });
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerNouveautes();
}

async function basculerNouveaute(id, actif) {
  var { error } = await sb.from('nouveautes').update({ actif: actif }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); await chargerNouveautes(); }
}

async function supprimerNouveaute(id, titre) {
  if (!confirm('Supprimer définitivement "' + titre + '" ?')) return;
  var { error } = await sb.from('nouveautes').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerNouveautes();
}

async function chargerSecteurs() {
  var { data: secteurs, error } = await sb.from('secteurs').select('*').order('ordre', { ascending: true });
  if (error) {
    document.getElementById('zone-secteurs').innerHTML = '<p style="color:var(--danger);">Erreur secteurs : ' + escHtml(error.message) + '</p>';
    return;
  }
  document.getElementById('zone-secteurs').innerHTML =
    '<div class="dcard">' +
      '<div class="dchdr"><span>Secteurs d\'activité (' + secteurs.length + ')</span></div>' +
      '<div class="dcbdy"><table class="dtbl">' +
        '<thead><tr><th>Icône</th><th>Nom (FR)</th><th>Code</th><th></th></tr></thead>' +
        '<tbody>' + secteurs.map(renderLigneSecteur).join('') + '</tbody>' +
      '</table></div>' +
      '<div style="padding:14px 18px;border-top:1px solid var(--brd);display:flex;gap:8px;align-items:center;">' +
        '<input id="nouveau-secteur" type="text" placeholder="Ex : Esthétique, Comptabilité…" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--b2);font-family:\'Outfit\',sans-serif;font-size:13px;" onkeydown="if(event.key===\'Enter\')ajouterSecteur()">' +
        '<button onclick="ajouterSecteur()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;">+ Ajouter</button>' +
      '</div>' +
      '<div class="note">💡 Cliquez sur l\'icône d\'un secteur pour la modifier, puis "OK" pour l\'enregistrer.</div>' +
    '</div>';
}

function renderLigneSecteur(s) {
  return '<tr>' +
    '<td>' +
      '<input type="text" value="' + escHtml(s.icon || '✨') + '" maxlength="4" id="icone-' + s.id + '" ' +
        'style="width:44px;text-align:center;padding:5px 4px;border-radius:6px;border:1px solid var(--b2);font-size:16px;" ' +
        'onkeydown="if(event.key===\'Enter\')sauverIconeSecteur(\'' + s.id + '\')">' +
      '<button onclick="sauverIconeSecteur(\'' + s.id + '\')" title="Enregistrer l\'icône" style="margin-left:4px;padding:5px 8px;border-radius:6px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:11px;font-weight:700;cursor:pointer;">OK</button>' +
    '</td>' +
    '<td><strong>' + escHtml(s.label_fr) + '</strong></td>' +
    '<td style="color:var(--mu);font-family:\'JetBrains Mono\',monospace;font-size:11.5px;">' + escHtml(s.code) + '</td>' +
    '<td><button class="btn-del" onclick="supprimerSecteur(' + attrJs(s.id) + ',' + attrJs(s.label_fr) + ')">Supprimer</button></td>' +
  '</tr>';
}

async function sauverIconeSecteur(id) {
  var champ = document.getElementById('icone-' + id);
  var icone = champ.value.trim() || '✨';
  var { error } = await sb.from('secteurs').update({ icon: icone }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  champ.value = icone;
}

async function ajouterSecteur() {
  var input = document.getElementById('nouveau-secteur');
  var label = input.value.trim();
  if (!label) return;
  var code = slugify(label);
  var { data: existant } = await sb.from('secteurs').select('id').eq('code', code).maybeSingle();
  if (existant) { alert('Un secteur avec un code très proche existe déjà.'); return; }
  var { data: max } = await sb.from('secteurs').select('ordre').order('ordre', { ascending: false }).limit(1).maybeSingle();
  var { error } = await sb.from('secteurs').insert({
    code: code, label_fr: label, icon: '✨', ordre: (max ? max.ordre : 0) + 1,
  });
  if (error) { alert('Erreur : ' + error.message); return; }
  input.value = '';
  await chargerSecteurs();
}

async function supprimerSecteur(id, nom) {
  if (!confirm('Supprimer le secteur "' + nom + '" ?\n\nLes artisans déjà enregistrés sous ce secteur garderont ce code, mais il ne sera plus proposé pour les nouvelles inscriptions ni les recherches.')) return;
  var { error } = await sb.from('secteurs').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  await chargerSecteurs();
}

async function init() {
  var { data } = await sb.auth.getSession();
  if (!data.session || data.session.user.email !== ADMIN_EMAIL) {
    document.getElementById('wrap').innerHTML =
      '<div class="access-denied"><h1>Accès refusé</h1><p style="color:var(--mu);">Ce panneau est réservé à l\'administrateur.</p></div>';
    return;
  }
  _session = data.session;
  document.getElementById('admin-nav').style.display = 'flex';
  document.getElementById('wrap').innerHTML =
    '<div class="apnl active" id="zone-artisans"></div>' +
    '<div class="apnl" id="zone-secteurs"></div>' +
    '<div class="apnl" id="zone-nouveautes"></div>' +
    '<div class="apnl" id="zone-avis-produit"></div>' +
    '<div class="apnl" id="zone-prelevement-prestations"></div>' +
    '<div class="apnl" id="zone-litiges"></div>';
  await chargerSecteurs();
  await chargerNouveautes();
  await chargerAvisProduit();
  renderZonePrelevementPrestations();
  await chargerArtisans();
  await chargerLitiges();
}

function switchAdminTab(i) {
  document.querySelectorAll('#admin-nav .atab').forEach(function(b, idx) { b.classList.toggle('active', idx === i); });
  document.querySelectorAll('#wrap .apnl').forEach(function(p, idx) { p.classList.toggle('active', idx === i); });
}

// ── Prélèvement mensuel de la commission prestations (à lancer soi-même pour l'instant) ──
function moisDernierISO() {
  var d = new Date(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - 1);
  return d.toISOString().slice(0, 10);
}

function renderZonePrelevementPrestations() {
  var zone = document.getElementById('zone-prelevement-prestations');
  zone.innerHTML =
    '<div class="dcard">' +
      '<div class="dchdr"><span>Prélèvement mensuel — commission prestations</span></div>' +
      '<div class="dcbdy" style="padding:16px;">' +
        '<p style="font-size:12.5px;color:var(--mu);margin-bottom:12px;">Calcule et débite, pour chaque artisan ayant une carte enregistrée, 7 % de la part au-dessus de 300 € de prestations "annuaire" sur le mois choisi. Un mois déjà traité n\'est jamais retraité.</p>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">' +
          '<label style="font-size:12.5px;color:var(--mu2);">Mois à traiter :</label>' +
          '<input type="month" id="pp-mois" value="' + moisDernierISO().slice(0, 7) + '" style="padding:6px 10px;border-radius:7px;border:1px solid var(--brd);">' +
          '<button class="btn-primary" id="btn-pp-lancer" onclick="lancerPrelevementPrestations()" style="padding:8px 16px;font-size:12.5px;">Lancer le prélèvement</button>' +
        '</div>' +
        '<div id="pp-resultat"></div>' +
      '</div>' +
    '</div>';
}

async function lancerPrelevementPrestations() {
  var btn = document.getElementById('btn-pp-lancer');
  var zoneRes = document.getElementById('pp-resultat');
  var moisChoisi = document.getElementById('pp-mois').value; // "AAAA-MM"
  if (!moisChoisi) { alert('Choisis un mois.'); return; }
  var moisISO = moisChoisi + '-01';

  if (!confirm('Lancer le prélèvement pour ' + moisChoisi + ' ?\n\nÇa va débiter réellement les cartes enregistrées des artisans concernés. Cette action ne peut pas être annulée (mais ne prélève jamais deux fois le même mois).')) return;

  btn.disabled = true; btn.textContent = 'Traitement en cours…';
  zoneRes.innerHTML = '';
  try {
    var { data: { session } } = await sb.auth.getSession();
    var res = await fetch(SUPABASE_URL + '/functions/v1/prelever-commission-prestations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ mois_iso: moisISO }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);

    var LABELS = { reussi: '✅ Prélevé', sous_le_seuil: '— Sous le seuil (rien dû)', sous_minimum_stripe: 'ℹ️ Trop petit pour Stripe (< 0,50€)', echoue: '❌ Échec', deja_traite: '⏭️ Déjà traité', erreur: '⚠️ Erreur' };
    var COULEURS = { reussi: '#0f9d78', sous_le_seuil: 'var(--mu)', sous_minimum_stripe: 'var(--mu)', echoue: '#dc2626', deja_traite: 'var(--mu)', erreur: '#dc2626' };

    zoneRes.innerHTML =
      '<p style="font-size:12.5px;color:var(--mu2);margin-bottom:8px;">' + data.traites + ' artisan(s) examiné(s) pour ' + moisChoisi + '.</p>' +
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' +
        '<thead><tr style="text-align:left;color:var(--mu);"><th style="padding:4px 8px;">Artisan</th><th style="padding:4px 8px;">Résultat</th><th style="padding:4px 8px;">Détail</th></tr></thead>' +
        '<tbody>' +
          data.resultats.map(function(r) {
            var detail = r.statut === 'reussi' ? (r.commission || 0) + ' € prélevés'
              : r.statut === 'sous_le_seuil' ? (r.ca || 0) + ' € de CA ce mois-ci'
              : r.statut === 'sous_minimum_stripe' ? (r.commission || 0) + ' € dus, non prélevés (trop petit)'
              : r.erreur || '';
            return '<tr style="border-top:1px solid var(--brd);">' +
              '<td style="padding:4px 8px;">' + escHtml(r.artisan_id) + '</td>' +
              '<td style="padding:4px 8px;color:' + (COULEURS[r.statut] || 'inherit') + ';font-weight:600;">' + (LABELS[r.statut] || r.statut) + '</td>' +
              '<td style="padding:4px 8px;color:var(--mu2);">' + escHtml(String(detail)) + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody>' +
      '</table>';
  } catch (e) {
    zoneRes.innerHTML = '<p style="color:var(--danger);font-size:12.5px;">Erreur : ' + escHtml(e.message) + '</p>';
  } finally {
    btn.disabled = false; btn.textContent = 'Lancer le prélèvement';
  }
}

// ── Avis produit CaraLink (projet LearnLogic — distinct du projet Artisans) ──
var LL_SUPABASE_URL = 'https://coqprurgsvfxddbmwtor.supabase.co';

async function chargerAvisProduit() {
  var zone = document.getElementById('zone-avis-produit');
  try {
    var { data: { session } } = await sb.auth.getSession();
    var res = await fetch(LL_SUPABASE_URL + '/functions/v1/lire-avis?admin=1', {
      headers: { 'Authorization': 'Bearer ' + session.access_token },
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    var avisEnAttente = data.avis || [];

    if (!avisEnAttente.length) {
      zone.innerHTML = '<div class="dcard"><div class="dchdr"><span>Avis produit en attente (0)</span></div><div class="dcbdy" style="padding:16px;"><p style="font-size:13px;color:var(--mu);">Aucun avis en attente de validation.</p></div></div>';
      return;
    }

    zone.innerHTML =
      '<div class="dcard">' +
        '<div class="dchdr"><span>Avis produit en attente (' + avisEnAttente.length + ')</span></div>' +
        '<div class="dcbdy" style="padding:16px;">' +
          avisEnAttente.map(function(a) {
            return '<div style="border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px;">' +
              '<div style="font-size:12px;color:var(--mu);margin-bottom:6px;">' + escHtml(a.type) + ' — ' + escHtml(a.nom_affiche) + '</div>' +
              '<div style="font-size:13.5px;margin-bottom:12px;">« ' + escHtml(a.texte) + ' »</div>' +
              '<button class="btn-primary" style="padding:6px 14px;font-size:12px;" onclick="modererAvisProduit(\'' + a.id + '\',\'valider\')">✓ Valider</button> ' +
              '<button class="btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="modererAvisProduit(\'' + a.id + '\',\'refuser\')">✕ Refuser</button>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
  } catch (e) {
    zone.innerHTML = '<div class="dcard"><div class="dcbdy" style="padding:16px;"><p style="color:var(--danger);">Erreur avis produit : ' + escHtml(e.message) + '</p></div></div>';
  }
}

async function modererAvisProduit(id, action) {
  try {
    var { data: { session } } = await sb.auth.getSession();
    var res = await fetch(LL_SUPABASE_URL + '/functions/v1/lire-avis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ id: id, action: action }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    await chargerAvisProduit();
  } catch (e) {
    alert('Erreur : ' + e.message);
  }
}

// ── Litiges Stripe — jamais une récupération automatique, toujours un geste volontaire ──
async function chargerLitiges() {
  var zone = document.getElementById('zone-litiges');
  if (!zone) return;

  var { data: litiges, error } = await sb.from('litiges_stripe')
    .select('*, artisans(nom_entreprise)')
    .order('created_at', { ascending: false });
  if (error) {
    zone.innerHTML = '<p style="color:var(--danger);padding:16px;">Erreur litiges : ' + escHtml(error.message) + '</p>';
    return;
  }

  var ouverts = (litiges || []).filter(function(l) { return l.statut !== 'won' && l.statut !== 'lost' && l.statut !== 'warning_closed'; });
  var clos = (litiges || []).filter(function(l) { return !ouverts.includes(l); });

  zone.innerHTML =
    '<div class="dcard">' +
      '<div class="dchdr"><span>⚠️ Litiges Stripe' + (ouverts.length ? ' — ' + ouverts.length + ' en cours' : '') + '</span></div>' +
      '<div class="dcbdy" style="padding:16px;">' +
        '<p style="font-size:12.5px;color:var(--mu);margin-bottom:14px;">Avec des paiements en destination charge, un litige débite toujours notre solde Stripe, jamais directement celui de l\'artisan — même si l\'argent lui a déjà été transféré. "Récupérer" tente de reprendre ce montant sur son solde ; ça échoue proprement s\'il n\'a plus assez disponible.</p>' +
        (litiges && litiges.length
          ? '<table class="dtbl"><thead><tr><th>Date</th><th>Artisan</th><th>Montant</th><th>Motif</th><th>Statut</th><th>Réponse avant</th><th></th></tr></thead><tbody>' +
              litiges.map(renderLigneLitige).join('') +
            '</tbody></table>'
          : '<div class="etat-vide-tbl">Aucun litige pour l\'instant.</div>') +
      '</div>' +
    '</div>';
}

function renderLigneLitige(l) {
  var nomArtisan = (l.artisans && l.artisans.nom_entreprise) || '—';
  var dateCree = new Date(l.created_at).toLocaleDateString('fr-FR');
  var dateLimite = l.date_echeance_reponse ? new Date(l.date_echeance_reponse).toLocaleDateString('fr-FR') : '—';

  var LABELS_STATUT = {
    needs_response: '🔴 Réponse nécessaire', warning_needs_response: '🟠 Alerte précoce',
    under_review: '🔵 En cours d\'examen', won: '✅ Gagné', lost: '❌ Perdu', warning_closed: '⚪ Alerte close',
  };
  var statutAff = LABELS_STATUT[l.statut] || l.statut;

  var colonneAction;
  if (l.transfer_reverse_statut === 'reussi') {
    colonneAction = '<span style="color:#16a34a;font-size:11.5px;font-weight:700;">✓ Récupéré (' + Number(l.transfer_reverse_montant).toFixed(2) + ' €)</span>';
  } else if (l.transfer_reverse_statut === 'echec') {
    colonneAction = '<span style="color:var(--danger);font-size:11px;">Échec — </span><button class="addb" onclick="recupererLitige(\'' + l.id + '\')">Réessayer</button>';
  } else {
    colonneAction = '<button class="addb" onclick="recupererLitige(\'' + l.id + '\')">Récupérer auprès de l\'artisan</button>';
  }

  return '<tr>' +
    '<td style="white-space:nowrap;">' + dateCree + '</td>' +
    '<td>' + escHtml(nomArtisan) + '</td>' +
    '<td style="font-weight:700;">' + Number(l.montant).toFixed(2) + ' €</td>' +
    '<td style="font-size:11.5px;color:var(--mu);">' + escHtml(l.motif || '—') + '</td>' +
    '<td>' + statutAff + '</td>' +
    '<td style="white-space:nowrap;">' + dateLimite + '</td>' +
    '<td id="litige-action-' + l.id + '">' + colonneAction + '</td>' +
  '</tr>';
}

async function recupererLitige(litigeId) {
  if (!confirm('Confirmer la récupération de ce montant auprès de l\'artisan ?\n\nÇa ne fonctionnera que s\'il a encore ce montant disponible sur son solde Stripe.')) return;
  var cellule = document.getElementById('litige-action-' + litigeId);
  cellule.innerHTML = '<span style="font-size:11.5px;color:var(--mu);">Tentative en cours…</span>';
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/admin-recuperer-litige', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _session.access_token },
      body: JSON.stringify({ litige_id: litigeId }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    await chargerLitiges();
  } catch (e) {
    alert('Erreur : ' + e.message);
    await chargerLitiges();
  }
}

var _artisansCache = [];

async function chargerArtisans() {
  var { data: artisans, error } = await sb.from('artisans').select('*').order('created_at', { ascending: false });
  if (error) {
    document.getElementById('zone-artisans').innerHTML = '<p style="color:var(--danger);">Erreur : ' + escHtml(error.message) + '</p>';
    return;
  }
  _artisansCache = artisans;

  var nbPro = artisans.filter(function(a) { return a.plan === 'pro'; }).length;
  var nbOffert = artisans.filter(function(a) { return a.plan === 'pro_offert'; }).length;
  var nbEssentiel = artisans.length - nbPro - nbOffert;

  document.getElementById('zone-artisans').innerHTML =
    '<div class="dcard">' +
      '<div class="dchdr"><span>Tous les artisans (' + artisans.length + ')</span>' +
        '<span style="font-size:12px;font-weight:600;color:var(--mu2);">' + nbEssentiel + ' Essentiel · ' + nbOffert + ' Pro offert · ' + nbPro + ' Pro abonné' + (nbPro > 1 ? 's' : '') + '</span></div>' +
      '<div class="dcbdy"><table class="dtbl">' +
        '<thead><tr><th>Entreprise</th><th>Secteur</th><th>Commune</th><th>Vérifié</th><th>Offre</th><th>Inscrit le</th><th></th></tr></thead>' +
        '<tbody>' + artisans.map(renderLigneArtisan).join('') + '</tbody>' +
      '</table></div>' +
      '<div class="note">💡 Cliquez sur le badge "Vérifié" pour le modifier, ou choisissez l\'offre d\'un artisan (Essentiel / Pro offert). Un Pro abonné vient de Stripe : il se change dans Stripe, pas ici. Chaque modification passe par une fonction serveur sécurisée, jamais par une écriture directe.</div>' +
    '</div>';
}

// Colonne Offre. "Pro (abonné)" est posé par Stripe (webhook) : jamais modifiable à la main ici, le serveur
// le refuse aussi. Seuls Essentiel et Pro offert se choisissent.
function renderCelluleOffre(a) {
  var plan = a.plan || 'gratuit';
  if (plan === 'pro') {
    var fin = a.abonnement_echeance ? new Date(a.abonnement_echeance).toLocaleDateString('fr-FR') : null;
    var detail = a.abonnement_fin_programmee ? 'résilié' + (fin ? ' — Pro jusqu\'au ' + fin : '')
      : a.abonnement_statut === 'essai' ? 'essai' + (fin ? ' jusqu\'au ' + fin : '')
      : 'renouvellement' + (fin ? ' le ' + fin : '');
    return '<span class="badge-ok">Pro (abonné)</span>' +
      '<div style="font-size:10.5px;color:var(--mu);margin-top:3px;line-height:1.4;">Stripe — ' + escHtml(detail) +
        (a.abonnement_paiement_en_echec ? ' · <strong style="color:var(--danger);">⚠️ paiement échoué</strong>' : '') +
        '<br>À changer dans Stripe.</div>';
  }
  return '<select onchange="changerPlan(' + attrJs(a.id) + ', this.value)" style="font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:6px;border:1px solid var(--brd);background:var(--p2);color:var(--mu2);">' +
    '<option value="gratuit"' + (plan === 'gratuit' ? ' selected' : '') + '>Essentiel</option>' +
    '<option value="pro_offert"' + (plan === 'pro_offert' ? ' selected' : '') + '>🎁 Pro offert</option></select>';
}

function renderLigneArtisan(a) {
  var dateAff = new Date(a.created_at).toLocaleDateString('fr-FR');
  var badgeVerifie = a.verifie
    ? '<span class="badge-ok" style="cursor:pointer;" title="Cliquer pour retirer la vérification" onclick="toggleVerifie(' + attrJs(a.id) + ', false)">Vérifié</span>'
    : '<span class="badge-attente" style="cursor:pointer;" title="Cliquer pour marquer comme vérifié" onclick="toggleVerifie(' + attrJs(a.id) + ', true)">' + (a.verification_statut === 'en_attente' ? 'En attente' : 'Non vérifié') + '</span>';

  return '<tr>' +
    '<td><strong>' + escHtml(a.nom_entreprise) + '</strong></td>' +
    '<td>' + escHtml(a.secteur) + '</td>' +
    '<td>' + escHtml(a.commune) + '</td>' +
    '<td>' + badgeVerifie + '</td>' +
    '<td>' + renderCelluleOffre(a) + '</td>' +
    '<td>' + dateAff + '</td>' +
    // Seul l'identifiant (généré par la base) passe dans l'attribut : le nom est relu dans _artisansCache.
    '<td><button class="btn-del" onclick="supprimerCompte(' + attrJs(a.id) + ')">Supprimer</button></td>' +
  '</tr>';
}

async function appelerActionAdmin(artisanId, champs) {
  var res = await fetch(SUPABASE_URL + '/functions/v1/admin-modifier-artisan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _session.access_token },
    body: JSON.stringify({ artisan_id: artisanId, ...champs }),
  });
  var data = await res.json();
  if (data.error) throw new Error(data.error);
}

async function toggleVerifie(artisanId, nouvelleValeur) {
  try {
    await appelerActionAdmin(artisanId, { verifie: nouvelleValeur });
    await chargerArtisans();
  } catch (e) { alert('Erreur : ' + e.message); }
}

async function changerPlan(artisanId, nouveauPlan) {
  var a = _artisansCache.find(function(x) { return x.id === artisanId; });
  var nom = a ? a.nom_entreprise : 'cet artisan';
  var question = nouveauPlan === 'pro_offert'
    ? 'Offrir l\'offre Pro à « ' + nom + ' » ?\n\nElle lui donnera gratuitement : catalogue illimité, Mes fournitures avec scan, détection de planning chargé, suggestions d\'avis et bouton Retard.'
    : 'Retirer le Pro offert à « ' + nom + ' » ?\n\nRien n\'est supprimé : ses produits et ses fournitures restent visibles. En revanche il ne pourra plus créer de fournitures ni dépasser 15 produits.';
  if (!confirm(question)) { await chargerArtisans(); return; } // remet le menu sur sa valeur d'origine
  try { await appelerActionAdmin(artisanId, { plan: nouveauPlan }); }
  catch (e) { alert('Erreur : ' + e.message); }
  await chargerArtisans();
}

async function supprimerCompte(artisanId) {
  var a = _artisansCache.find(function(x) { return x.id === artisanId; });
  if (!a) return;
  var userId = a.user_id, nom = a.nom_entreprise;
  if (!confirm('Supprimer définitivement le compte de "' + nom + '" ?\n\nCette action est irréversible : profil, services, photos, clients, interventions et factures seront tous effacés.')) return;
  if (!confirm('Vraiment sûr ? Il n\'y a aucun moyen de revenir en arrière.')) return;

  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/admin-supprimer-artisan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _session.access_token },
      body: JSON.stringify({ user_id: userId }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    alert('Compte supprimé : ' + data.email);
    await chargerArtisans();
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
}

init();
</script>
</body>
</html>
