<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://uzgboxfxpxazhysusewv.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Répondre à une demande — CaraLink Artisans</title>
<style>
:root{--terre:#B5502F;--terre-fonce:#9a4126;--encre:#13223c;--gris:#6b7c96;--fond:#f7f9fc;--bord:#e3eaf4;--vert:#16a34a;--rouge:#dc2626;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--fond);color:var(--encre);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;line-height:1.5}
.marque{font-weight:800;font-size:15px;letter-spacing:.2px;color:var(--terre);margin:0 0 14px;text-align:center}
.carte{background:#fff;border-radius:16px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(19,34,60,.1)}
h1{font-size:20px;margin:0 0 8px;line-height:1.3;overflow-wrap:anywhere}
h1.ok{color:var(--vert)} h1.neutre{color:var(--gris)} h1.erreur{color:var(--rouge)}
p{margin:0 0 14px;font-size:14.5px;color:#4a5c78;overflow-wrap:anywhere}
p.sous{color:var(--gris);font-size:13.5px;margin-bottom:18px}
label.champ{display:block;font-size:13px;font-weight:600;color:var(--encre);margin:0 0 6px}
textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--bord);font-family:inherit;font-size:15px;color:var(--encre);resize:vertical;min-height:96px;margin:0 0 6px;background:#fff}
textarea + button.principal{margin-top:14px}
textarea:focus{outline:3px solid rgba(181,80,47,.25);border-color:var(--terre)}
.compteur{font-size:12px;color:var(--gris);text-align:right;margin:0 0 14px}
button.principal,a.bouton{display:block;width:100%;padding:14px;border-radius:10px;border:none;background:var(--terre);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;min-height:48px}
button.principal:hover,a.bouton:hover{background:var(--terre-fonce)}
button.principal.vert{background:var(--vert)} button.principal.gris{background:var(--gris)}
button.principal:focus-visible,a.bouton:focus-visible{outline:3px solid rgba(19,34,60,.35);outline-offset:2px}
button.principal[disabled]{opacity:.6;cursor:not-allowed}
a.bouton{margin-top:16px}
.alerte{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px;overflow-wrap:anywhere}
.chargement{color:var(--gris);text-align:center;font-size:14px;margin:6px 0}
.etoiles{display:flex;justify-content:center;gap:4px;margin:6px 0 18px;border:0;padding:0}
.etoiles legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.etoiles label{cursor:pointer;display:inline-flex;padding:2px;border-radius:8px}
.etoiles input{position:absolute;opacity:0;width:1px;height:1px}
.etoiles input:focus-visible + svg{outline:3px solid rgba(181,80,47,.45);outline-offset:3px;border-radius:6px}
.etoiles svg{width:40px;height:40px;fill:#e3eaf4;transition:fill .12s}
.etoiles svg.active{fill:#f59e0b}
.aide{font-size:12.5px;color:var(--gris);margin:-8px 0 16px;text-align:center}
@media (max-width:380px){.carte{padding:24px 18px}.etoiles svg{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<p class="marque">CaraLink Artisans</p>
<main class="carte" id="contenu" aria-live="polite"><p class="chargement">Chargement…</p></main>
<noscript><p style="margin-top:16px;text-align:center">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="repondre.js"></script>
</body>
</html>
