<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://js.stripe.com; style-src 'unsafe-inline'; connect-src https://uzgboxfxpxazhysusewv.supabase.co https://*.stripe.com https://*.stripe.network; frame-src https://*.stripe.com https://*.stripe.network; img-src https://*.stripe.com data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Paiement — CaraLink Artisans</title>
<style>
:root{--terre:#B5502F;--terre-fonce:#9a4126;--encre:#13223c;--gris:#6b7c96;--fond:#f7f9fc;--bord:#e3eaf4;--vert:#16a34a;--rouge:#dc2626;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--fond);color:var(--encre);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;line-height:1.5}
.marque{font-weight:800;font-size:15px;letter-spacing:.2px;color:var(--terre);margin:0 0 14px;text-align:center}
.carte{background:#fff;border-radius:16px;padding:30px 26px;width:100%;max-width:460px;box-shadow:0 8px 32px rgba(19,34,60,.1)}
h1{font-size:20px;margin:0 0 8px;line-height:1.3;overflow-wrap:anywhere}
h1.ok{color:var(--vert)} h1.neutre{color:var(--gris)} h1.erreur{color:var(--rouge)}
p{margin:0 0 14px;font-size:14.5px;color:#4a5c78;overflow-wrap:anywhere}
.montant{font-size:30px;font-weight:800;color:var(--encre);margin:4px 0 2px}
.resume{background:var(--fond);border:1px solid var(--bord);border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 16px;color:var(--encre)}
.resume div + div{margin-top:4px}
.case{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#4a5c78;margin:0 0 12px;cursor:pointer}
.case input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--terre)}
button.principal,a.bouton{display:block;width:100%;padding:14px;border-radius:10px;border:none;background:var(--terre);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;min-height:48px}
button.principal:hover,a.bouton:hover{background:var(--terre-fonce)}
button.principal[disabled]{opacity:.55;cursor:not-allowed}
button.principal:focus-visible,a.bouton:focus-visible{outline:3px solid rgba(19,34,60,.35);outline-offset:2px}
a.bouton{margin-top:16px}
a.lien{display:block;text-align:center;font-size:13px;color:var(--gris);margin-top:14px}
.alerte{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px;overflow-wrap:anywhere}
.chargement{color:var(--gris);text-align:center;font-size:14px;margin:6px 0}
.secu{font-size:12px;color:var(--gris);text-align:center;margin:12px 0 0}
#element{margin:0 0 16px;min-height:60px}
@media (max-width:380px){.carte{padding:24px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<p class="marque">CaraLink Artisans</p>
<main class="carte" id="contenu" aria-live="polite"><p class="chargement">Chargement…</p></main>
<noscript><p style="margin-top:16px;text-align:center">Cette page a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="https://js.stripe.com/v3/"></script>
<script src="payer-prestation.js"></script>
</body>
</html>
