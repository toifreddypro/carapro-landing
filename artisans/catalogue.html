<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — CaraLink Artisans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fb;--panel:#ffffff;--brd:#e3eaf4;--b2:#c9d8ef;
    --ac:#B5502F;--ac2:#B5502F;--tx:#13223c;--mu:#6b7c96;--mu2:#4a5c78;
    --inp:#f6f9fe;--ok:#059669;--gold:#b45309;--danger:#dc2626;
  }
  /* Fond de boutique choisi par l'artisan : on change seulement les variables. Les fenêtres (panier, paiement) restent claires : le formulaire de carte Stripe est clair. */
  :root.fond-creme{--bg:#f6efe4;--panel:#fffdf8;--brd:#e6dccb;--b2:#e6dccb;--inp:#faf5ec;--tx:#2a2118;--mu:#7a6c5b;--mu2:#5b4d3d;}
  :root.fond-terre{--bg:#f8ebe4;--panel:#fffaf7;--brd:#ecd5c9;--b2:#ecd5c9;--inp:#fbf1ec;}
  :root.fond-bleu{--bg:#e6eff9;--panel:#f9fbfe;--brd:#cddcee;--b2:#cddcee;--inp:#eef4fb;}
  :root.fond-vert{--bg:#e5f2e9;--panel:#f9fcfa;--brd:#cbe3d2;--b2:#cbe3d2;--inp:#eef7f1;}
  :root.fond-rose{--bg:#fae6f1;--panel:#fffafd;--brd:#efcade;--b2:#efcade;--inp:#fcf0f6;}
  :root.fond-violet{--bg:#ece7f8;--panel:#fbfaff;--brd:#d9d0ef;--b2:#d9d0ef;--inp:#f3f0fb;}
  :root.fond-ocre{--bg:#f8efd9;--panel:#fffdf6;--brd:#ecdcb4;--b2:#ecdcb4;--inp:#fbf5e4;}
  :root.fond-sombre{--bg:#0f1115;--panel:#1a1d24;--brd:#2c313c;--b2:#2c313c;--inp:#232732;--tx:#f3f1ec;--mu:#9ba4b3;--mu2:#c5ccd8;--ok:#34d399;--gold:#f0b44c;color-scheme:dark;}
  /* Fonds photo : l'image est posée derrière (fixe, ne défile pas), voilée pour garder le texte lisible ; les cartes restent pleines. */
  :root.fond-plage{--bg:#e8f5f7;--panel:#ffffff;--brd:#cfe3e8;--b2:#cfe3e8;--inp:#f0f8fa;}
  :root.fond-sable{--bg:#f7efe2;--panel:#fffdf8;--brd:#e8dcc8;--b2:#e8dcc8;--inp:#faf4ea;}
  :root.fond-motif{--bg:#0f1115;--panel:#1a1d24;--brd:#2c313c;--b2:#2c313c;--inp:#232732;--tx:#f3f1ec;--mu:#9ba4b3;--mu2:#c5ccd8;--ok:#34d399;--gold:#f0b44c;color-scheme:dark;}
  :root.fond-plage body,:root.fond-sable body,:root.fond-motif body{background:transparent;}
  :root.fond-plage,:root.fond-sable,:root.fond-motif{background:var(--bg);}
  :root.fond-plage body::before,:root.fond-sable body::before,:root.fond-motif body::before{content:'';position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;}
  :root.fond-plage body::before{background-image:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),url('img/fond-plage.webp');}
  :root.fond-sable body::before{background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url('img/fond-sable.webp');}
  :root.fond-motif body::before{background-image:linear-gradient(rgba(15,17,21,.74),rgba(15,17,21,.74)),url('img/fond-motif.webp');}
  :root[class*="fond-"] .modal-overlay{--bg:#f7f8fb;--panel:#ffffff;--brd:#e3eaf4;--b2:#c9d8ef;--inp:#f6f9fe;--tx:#13223c;--mu:#6b7c96;--mu2:#4a5c78;--ok:#059669;--gold:#b45309;color-scheme:light;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;padding-bottom:60px;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
  /* Grand écran : la page respire sur toute la largeur au lieu d'une colonne étroite façon réseau social. */
  @media(min-width:1200px){.wrap{max-width:1400px;padding:0 40px;}}

  /* En-tête boutique */
  /* En-tête sans grande barre pleine largeur : le nom et les langues se posent directement sous la bannière, alignés sur le reste de la page. */
  header{background:transparent;border-bottom:none;padding:18px 0 6px;margin-bottom:18px;}
  .header-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(181,80,47,.1);color:var(--ac);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;}
  /* Personnalisation : image de fond façon Facebook, logo qui la chevauche, infos pratiques */
  .hero{position:relative;}
  .hero .bandeau-couv{width:100%;aspect-ratio:3/1;max-height:460px;min-height:130px;background-color:var(--b2);background-size:cover;background-position:center;border-radius:0;}
  .hero.sans-image .bandeau-couv{background-image:linear-gradient(135deg,var(--ac),#13223c);aspect-ratio:auto;height:150px;}
  @media(min-width:701px){.hero.sans-image .bandeau-couv{height:250px;}}
  header.avec-couv{padding-top:0;}
  header.avec-couv .header-inner{align-items:flex-end;}
  .avatar.sur-banniere{width:88px;height:88px;margin-top:-44px;border:4px solid var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.12);}
  /* Écran large : le nom, le logo, Partager et les langues se posent sur l'image, avec un voile sombre pour rester lisibles quelle que soit la photo. */
  @media(min-width:701px){
    .hero .bandeau-couv{min-height:230px;}
    .hero-entete{position:absolute;left:0;right:0;bottom:0;margin:0;padding:80px 0 24px;background:linear-gradient(to top,rgba(10,16,28,.8),rgba(10,16,28,0));color:#fff;}
    .hero-entete .avatar.sur-banniere{width:96px;height:96px;margin-top:0;border:4px solid #fff;background:#fff;}
    .hero-entete .boutique-nom{font-size:clamp(28px,3.4vw,44px);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.4);}
    .hero-entete .boutique-meta{color:rgba(255,255,255,.9);}
    .hero-entete .badge-verifie{background:rgba(255,255,255,.95);color:#047857;}
    .hero-entete .btn-partage{border-color:rgba(255,255,255,.75)!important;color:#fff!important;background:rgba(255,255,255,.14)!important;}
    .hero-entete .btn-langue{border-color:rgba(255,255,255,.6)!important;color:#fff!important;background:transparent!important;}
    .hero-entete .btn-langue.actif{background:#fff!important;color:#13223c!important;border-color:#fff!important;}
  }
  .bloc-infos{display:flex;gap:28px;flex-wrap:wrap;background:var(--panel);border:1px solid transparent;box-shadow:0 2px 12px rgba(19,34,60,.07);border-radius:16px;padding:22px 26px;margin:22px 0 10px;}
  .info-colonne{flex:1;min-width:230px;}
  .info-titre{font-size:11.5px;font-weight:700;color:var(--mu2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;}
  .info-texte{white-space:pre-line;font-size:14px;line-height:1.6;color:var(--tx);overflow-wrap:anywhere;}
  .info-ligne{font-size:14px;margin-bottom:5px;overflow-wrap:anywhere;} .info-ligne a{color:var(--tx);text-decoration:none;font-weight:500;} .info-ligne a:hover{color:var(--ac);text-decoration:underline;}
  @media(max-width:600px){.avatar.sur-banniere{width:72px;height:72px;margin-top:-36px;}}
  .boutique-nom{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .boutique-meta{font-size:13.5px;color:var(--mu);margin-top:3px;}
  .badge-verifie{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(5,150,105,.1);color:var(--ok);}

  .promo-bandeau{background:rgba(181,80,47,.08);border:1px dashed var(--ac);border-radius:12px;padding:12px 18px;margin-top:18px;display:flex;align-items:center;gap:10px;font-size:14px;}
  .promo-code{font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--panel);border:1px solid var(--ac);border-radius:7px;padding:3px 10px;color:var(--ac);letter-spacing:.03em;}

  h2.section-titre{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;margin:44px 0 20px;}

  .grille{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(min-width:1150px){.grille{grid-template-columns:repeat(4,1fr);gap:26px;}}
  @media(max-width:760px){.grille{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.grille{grid-template-columns:1fr;}}

  /* Modes d'affichage (choix du visiteur, mémorisé) : petites icônes (par défaut), grandes icônes (= la grille d'origine), liste */
  .grille.vue-petites{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .vue-petites .carte-produit{border-radius:11px;}
  .vue-petites .carte-corps{padding:9px 10px 11px;gap:3px;}
  .vue-petites .produit-nom{font-size:13px;line-height:1.25;}
  .vue-petites .produit-desc{display:none;}
  .vue-petites .prix-ligne{margin-top:2px;gap:6px;}
  .vue-petites .prix-actuel{font-size:15px;}
  .vue-petites .prix-barre{font-size:11.5px;}
  .vue-petites .btn-commander{padding:7px;font-size:12px;margin-top:5px;border-radius:8px;}
  .vue-petites .photo-vide{font-size:28px;}
  .vue-petites .bandeau-badges{min-height:28px;padding:4px 8px;} .vue-petites .badge-remise,.vue-petites .badge-phare,.vue-petites .badge-nouveaute{font-size:10px;padding:2px 7px;}
  .vue-petites .delai-sur-commande{font-size:10.5px;}
  .grille.vue-liste{grid-template-columns:1fr;gap:10px;}
  .vue-liste .carte-produit{flex-direction:row;align-items:stretch;border-radius:11px;}
  .vue-liste .photo-wrap{width:96px;aspect-ratio:1;flex-shrink:0;}
  .vue-liste .photo-vide{font-size:30px;}
  .vue-liste .carte-corps{padding:10px 14px;gap:3px;justify-content:center;}
  .vue-liste .produit-desc{flex:0 0 auto;-webkit-line-clamp:1;font-size:12px;}
  .vue-liste .btn-commander{width:auto;align-self:flex-start;padding:7px 16px;font-size:12.5px;margin-top:5px;}
  .vue-liste .bandeau-badges{display:none;}
  .btn-vue{width:34px;height:32px;border:1px solid var(--brd);background:transparent;color:var(--tx);cursor:pointer;font-size:15px;line-height:1;padding:0;}
  .btn-vue:first-child{border-radius:8px 0 0 8px;} .btn-vue:last-child{border-radius:0 8px 8px 0;} .btn-vue + .btn-vue{border-left:none;}
  .btn-vue.actif{background:var(--ac);border-color:var(--ac);color:#fff;}

  .carte-produit{background:var(--panel);border:1px solid transparent;box-shadow:0 2px 12px rgba(19,34,60,.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  :root.fond-sombre .carte-produit,:root.fond-motif .carte-produit,:root.fond-sombre .bloc-infos,:root.fond-motif .bloc-infos{border-color:var(--brd);box-shadow:none;}
  .photo-wrap{position:relative;aspect-ratio:1;background:var(--inp);overflow:hidden;min-height:0;flex-shrink:0;}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-vide{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;}
  /* Pastilles : sur une bande AU-DESSUS de la photo, jamais dessus (la photo reste entière). */
  .bandeau-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px;padding:6px 10px;border-bottom:1px solid var(--brd);}
  .badge-remise,.badge-phare,.badge-nouveaute{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap;}
  .badge-remise{background:#be123c;margin-left:auto;} .badge-phare{background:#b45309;} .badge-nouveaute{background:#059669;}

  .carte-corps{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .produit-nom{font-weight:700;font-size:15px;}
  .produit-desc{font-size:12.5px;color:var(--mu);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
  .prix-ligne{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .prix-actuel{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:var(--ac);}
  .prix-barre{font-size:13px;color:var(--mu);text-decoration:line-through;}
  .btn-commander{margin-top:8px;width:100%;padding:10px;border-radius:9px;border:none;background:var(--ac);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;}
  .btn-commander:hover{opacity:.92;}
  .delai-sur-commande{font-size:11px;color:var(--mu);}

  .etat-page{max-width:520px;margin:80px auto;text-align:center;padding:0 20px;color:var(--mu);}
  .etat-page h1{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;color:var(--tx);margin-bottom:10px;}

  /* Modale commande (réutilise le principe existant : un produit à la fois pour l'instant) */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--panel);border-radius:16px;padding:26px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-box h3{font-family:'Bricolage Grotesque',sans-serif;margin-bottom:14px;}
  .modal-field{margin-bottom:12px;}
  .modal-field input[type=radio],.modal-field input[type=checkbox]{width:auto;flex:none;margin:0;padding:0;}
  .modal-field label{display:block;font-size:12.5px;color:var(--mu2);margin-bottom:4px;font-weight:600;}
  .modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--brd);background:var(--inp);font-family:'Outfit',sans-serif;font-size:13.5px;color:var(--tx);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:11px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;}
  .btn-primary{border:none;background:var(--ac);color:#fff;}
  .btn-secondary{border:1px solid var(--brd);background:transparent;color:var(--tx);}

  /* Panier */
  .panier-flottant{position:fixed;bottom:20px;right:20px;z-index:900;background:var(--ac);color:#fff;border:none;border-radius:50px;padding:13px 20px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(181,80,47,.35);display:none;align-items:center;gap:8px;}
  .panier-flottant.visible{display:inline-flex;}
  .panier-badge{background:#fff;color:var(--ac);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  .ligne-panier{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd);}
  .ligne-panier-photo{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--inp);}
  .ligne-panier-info{flex:1;min-width:0;}
  .ligne-panier-nom{font-size:13.5px;font-weight:600;}
  .ligne-panier-prix{font-size:12px;color:var(--mu);}
  .qte-controle{display:flex;align-items:center;gap:6px;}
  .qte-controle button{width:26px;height:26px;border-radius:6px;border:1px solid var(--brd);background:var(--inp);color:var(--tx);font-size:14px;font-weight:700;cursor:pointer;}
  .qte-controle span{min-width:18px;text-align:center;font-size:13px;font-weight:600;}
  .panier-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px;font-size:15px;font-weight:700;}
  .panier-total span:last-child{color:var(--ac);font-family:'Bricolage Grotesque',sans-serif;font-size:19px;}
  .panier-vider{font-size:12px;color:var(--mu);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;margin-top:8px;}
</style>
<script src="https://js.stripe.com/v3/"></script>
<script src="tr-artisans.js"></script>
</head>
<body>

<div id="racine">
  <div class="etat-page"><h1 data-i18n="cat_chargement">Chargement…</h1></div>
</div>

<button class="panier-flottant" id="btn-panier-flottant" onclick="ouvrirPanier()">
  🛒 <span data-i18n="cat_mon_panier">Mon panier</span> <span class="panier-badge" id="panier-badge">0</span>
</button>

<div class="modal-overlay" id="modal-panier">
  <div class="modal-box">
    <h3 data-i18n="cat_mon_panier">Mon panier</h3>
    <div id="panier-lignes"></div>
    <div id="panier-suggestions"></div>
    <div id="panier-promo"></div>
    <div class="panier-total"><span data-i18n="cat_total">Total</span><span id="panier-total-montant">0 €</span></div>
    <div style="font-size:11.5px;color:var(--mu);margin-top:4px;" data-i18n="cat_frais_info">Les frais de livraison éventuels sont calculés à l'étape suivante, selon votre adresse.</div>
    <button class="panier-vider" onclick="viderPanier()" data-i18n="cat_vider_panier">Vider le panier</button>
    <div class="modal-actions">
      <button class="btn-primary" onclick="ouvrirModaleCommande()" data-i18n="cat_passer_commande">Passer commande →</button>
      <button class="btn-secondary" onclick="fermerModalePanier()" data-i18n="cat_continuer_achats">Continuer mes achats</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-commande">
  <div class="modal-box">
    <h3 id="mc-titre" data-i18n="cat_vos_coordonnees">Vos coordonnées</h3>
    <div class="modal-field"><label data-i18n="cat_votre_nom">Votre nom</label><input type="text" id="mc-nom"></div>
    <div class="modal-field"><label data-i18n="cat_telephone">Téléphone</label><input type="tel" id="mc-tel"></div>
    <div class="modal-field"><label data-i18n="cat_email">Email</label><input type="email" id="mc-email" required autocomplete="email"></div>
    <div id="mc-compte" style="font-size:12.5px;color:var(--mu);margin:-4px 0 12px;"></div>
    <div id="mc-cashback" style="display:none;margin:0 0 14px;padding:11px 13px;border-radius:10px;background:rgba(181,80,47,.07);border:1px dashed var(--ac);font-size:13px;line-height:1.5;"></div>
    <div class="modal-field">
      <label data-i18n="cat_mode">Mode</label>
      <select id="mc-mode" onchange="document.getElementById('mc-adresse-bloc').style.display=this.value==='livraison'?'block':'none'; _fraisLivraison=null; planifierApercuFrais(); majCashback();">
        <option value="retrait" data-i18n="cat_je_viens_chercher">Je viens chercher</option>
        <option value="livraison" data-i18n="cat_livraison">Livraison</option>
      </select>
    </div>
    <div id="mc-adresse-bloc" style="display:none;">
      <div class="modal-field"><label data-i18n="cat_adresse">Adresse</label><input type="text" id="mc-adresse" oninput="planifierApercuFrais()"></div>
      <div class="modal-field"><label data-i18n="cat_code_postal">Code postal</label><input type="text" id="mc-cp" oninput="planifierApercuFrais()"></div>
      <div class="modal-field"><label data-i18n="cat_commune">Commune</label><input type="text" id="mc-commune" oninput="planifierApercuFrais()"></div>
      <div class="modal-field">
        <div id="mc-frais" style="margin-top:8px;font-size:13.5px;line-height:1.5;min-height:42px;"></div>
      </div>
      <div class="modal-field">
        <label data-i18n="cat_quand_livrer">Quand serez-vous livré ?</label>
        <div id="mc-fenetre" style="font-size:13.5px;line-height:1.5;min-height:42px;color:var(--mu);"></div>
        <label for="mc-date" style="margin-top:10px;font-weight:400;font-size:12.5px;"><span data-i18n="cat_pas_avant_le">Pas avant le</span> <span data-i18n="cat_facultatif_court">(facultatif)</span></label>
        <input type="date" id="mc-date" onchange="planifierApercuFrais()">
      </div>
    </div>
    <div class="modal-field"><label data-i18n="cat_notes_facultatif">Notes (facultatif)</label><textarea id="mc-notes" rows="2"></textarea></div>
    <div id="mc-err" style="display:none;color:var(--danger);font-size:12.5px;margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="mc-btn-confirmer" onclick="confirmerCommande()" data-i18n="cat_confirmer_commande">Confirmer la commande</button>
      <button class="btn-secondary" onclick="fermerModaleCommande()" data-i18n="cat_retour_panier">Retour au panier</button>
    </div>
  </div>
</div>

<script>

    if (!o || !o.access_token) return null;

    try { localStorage.setItem(cle, JSON.stringify(o)); } catch (e) {}

  var nom = document.getElementById('mc-nom').value.trim();

  if (!nom || !tel) { err.textContent = T('cat_nom_tel_requis'); err.style.display = 'block'; return; }
  var emailSaisi = document.getElementById('mc-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailSaisi)) { err.textContent = T('cat_email_requis'); err.style.display = 'block'; return; }

  var mode = document.getElementById('mc-mode').value;
  // Livraison : le client doit avoir VU le total avec les frais avant de confirmer (jamais de surprise au paiement).
  if (mode === 'livraison' && (!_fraisLivraison || _fraisLivraison.cle !== cleAdresseLivraison())) {
    var ok = await calculerFraisApercu();
    if (ok) { err.textContent = T('cat_verifier_total'); err.style.display = 'block'; }
    else { err.textContent = document.getElementById('mc-frais').textContent || T('cat_frais_echec'); err.style.display = 'block'; }
    return;
  }
  var btn = document.getElementById('mc-btn-confirmer');
  btn.disabled = true; btn.textContent = T('cat_envoi');
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/soumettre-commande-panier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({
        artisan_id: DATA.artisan.id,
        lignes: PANIER.map(function(l) { return { catalogue_id: l.catalogue_id, quantite: l.quantite }; }),
        client_nom: nom, client_telephone: tel, client_email: document.getElementById('mc-email').value.trim() || null,
        mode: mode,
        adresse_livraison: mode === 'livraison' ? document.getElementById('mc-adresse').value.trim() : null,
        code_postal_livraison: mode === 'livraison' ? document.getElementById('mc-cp').value.trim() : null,
        commune_livraison: mode === 'livraison' ? document.getElementById('mc-commune').value.trim() : null,
        pas_avant: mode === 'livraison' ? (document.getElementById('mc-date').value || null) : null,
        notes: document.getElementById('mc-notes').value.trim() || null,
        code_promo: PROMO ? PROMO.code : null,
        utiliser_cashback: CB.utiliser, access_token: await jetonClient(),
      }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);

    _dernierCommandeId = data.commande_id;
    _panierEnAttentePaiement = PANIER.slice(); // mis de côté : rendu au client s'il renonce à payer
    PANIER = [];
    sauverPanier();
    majBadgePanier();

    // Règle du 07/10 : pas de commande sans paiement en ligne. Le paiement est TOUJOURS l'étape suivante (le serveur refuse
    // d'ailleurs toute commande chez un artisan dont les paiements ne sont pas actifs).
    await afficherEtapePaiement(data.commande_id, data);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = T('cat_confirmer_commande');
  }
}

// ── Paiement en ligne (obligatoire : la commande n'existe pour l'artisan qu'une fois payée) ──
var _formCommandeHtml = null;        // le formulaire de commande d'origine, que l'écran de paiement remplace
var _panierEnAttentePaiement = null; // le panier du client, vidé à la création de la commande, rendu s'il renonce à payer
function restaurerFormulaireCommande() {
  var boite = document.querySelector('#modal-commande .modal-box');
  if (boite && _formCommandeHtml != null) { boite.innerHTML = _formCommandeHtml; if (typeof appliquerTraductionsStatiques === 'function') appliquerTraductionsStatiques(); }
}
function annulerPaiementCommande() {
  document.getElementById('modal-commande').classList.remove('show');
  restaurerFormulaireCommande(); // sans lui, le client ne pourrait plus commander avant d'avoir rechargé la page
  if (_panierEnAttentePaiement) { PANIER = _panierEnAttentePaiement; sauverPanier(); majBadgePanier(); }
  _panierEnAttentePaiement = null;
  alert(T('cat_commande_non_finalisee'));
}
async function afficherEtapePaiement(commandeId, recap) {
  var boite = document.querySelector('#modal-commande .modal-box');
  boite.innerHTML =
    '<h3>' + T('cat_derniere_etape') + '</h3>' +
    '<p style="font-size:12.5px;color:var(--mu);margin-bottom:10px;">' + T('cat_paiement_obligatoire_info') + '</p>' +
    (recap && recap.montant_total != null ? '<div style="font-size:13.5px;line-height:1.6;margin-bottom:14px;padding:10px 12px;border-radius:9px;background:var(--inp);">' + T('cat_produits_lbl') + ' : ' + fmtEur(recap.montant_produits != null ? recap.montant_produits : recap.montant_total - (recap.frais_livraison || 0)) + '<br>' + (recap.frais_livraison > 0 ? '🚚 ' + T('cat_frais_livraison') + ' : ' + fmtEur(recap.frais_livraison) + '<br>' : '') + '<strong>' + T('cat_total') + ' : ' + fmtEur(recap.montant_total) + '</strong></div>' : '') +
    '<div id="paiement-element" style="margin-bottom:14px;"></div>' +
    '<div id="paiement-err" style="display:none;color:var(--danger);font-size:12.5px;margin-bottom:10px;"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn-primary" id="btn-payer" disabled>' + T('cat_chargement') + '</button>' +
    '<button class="btn-secondary" id="btn-annuler-paiement" onclick="annulerPaiementCommande()">' + T('cat_annuler_commande') + '</button>' +
    '</div>';

  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/creer-paiement-commande', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ commande_id: commandeId }),
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);

    // Paiement direct : le formulaire de carte s'affiche SUR le compte Stripe de l'artisan (stripe_account renvoyé par le serveur).
    if (!_stripeClient || _stripeCompte !== (data.stripe_account || null)) {
      _stripeCompte = data.stripe_account || null;
      _stripeClient = _stripeCompte ? Stripe(STRIPE_PUBLIC_KEY, { stripeAccount: _stripeCompte }) : Stripe(STRIPE_PUBLIC_KEY);
    }
    _stripeElements = _stripeClient.elements({ clientSecret: data.client_secret });
    _stripeElements.create('payment').mount('#paiement-element');

    var btn = document.getElementById('btn-payer');
    btn.textContent = T('cat_payer'); btn.disabled = false;
    btn.onclick = confirmerPaiementCommande;
  } catch (e) {
    document.getElementById('paiement-err').textContent = T('cat_erreur_prefix') + e.message;
    document.getElementById('paiement-err').style.display = 'block';
    document.getElementById('btn-payer').style.display = 'none';
  }
}

async function confirmerPaiementCommande() {
  var btn = document.getElementById('btn-payer');
  var err = document.getElementById('paiement-err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = T('cat_paiement_en_cours');

  var { error } = await _stripeClient.confirmPayment({ elements: _stripeElements, redirect: 'if_required' });
  if (error) {
    err.textContent = error.message || T('cat_paiement_echoue');
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = T('cat_payer');
    return;
  }
  document.getElementById('modal-commande').classList.remove('show');
  _panierEnAttentePaiement = null;
  restaurerFormulaireCommande();
  alert(T('cat_paiement_confirme') + escHtml(DATA.artisan.nom_entreprise) + T('cat_va_preparer_commande'));
}

// ── Filtre par catégorie + tri par prix — tout se passe côté client, sans recharger ──
var _filtreCategorie = null; // null = toutes les catégories
var _triActif = 'pertinence'; // 'pertinence' | 'prix_asc' | 'prix_desc'
// Mode d'affichage de la grille, mémorisé dans le navigateur du visiteur (sans effet si le navigateur refuse le stockage).
var _vueGrille = 'petites'; // 'petites' | 'grandes' | 'liste'
try { var _vueMemo = localStorage.getItem('cat_vue'); if (_vueMemo === 'petites' || _vueMemo === 'grandes' || _vueMemo === 'liste') _vueGrille = _vueMemo; } catch (e) { /* stockage indisponible : on garde la valeur par défaut */ }
var LIBELLES_VUE = {
  fr: { petites: 'Petites icônes', grandes: 'Grandes icônes', liste: 'Liste' },
  en: { petites: 'Small icons', grandes: 'Large icons', liste: 'List' },
  es: { petites: 'Iconos pequeños', grandes: 'Iconos grandes', liste: 'Lista' },
};
function changerVue(v) {
  _vueGrille = v;
  try { localStorage.setItem('cat_vue', v); } catch (e) { /* sans importance */ }
  renderBarreFiltres();
  rerenderGrillePrincipale();
}

function categoriesDisponibles() {
  var vues = {};
  DATA.produits.forEach(function(p) { if (p.categorie) vues[p.categorie] = true; });
  return Object.keys(vues).sort(function(a, b) { return a.localeCompare(b, 'fr'); });
}

function renderBarreFiltres() {
  var cats = categoriesDisponibles();
  var zone = document.getElementById('barre-filtres');
  var pastilleTous = '<button onclick="filtrerParCategorie(null)" style="padding:6px 14px;border-radius:20px;border:1px solid ' + (!_filtreCategorie ? 'var(--ac)' : 'var(--brd)') + ';background:' + (!_filtreCategorie ? 'var(--ac)' : 'transparent') + ';color:' + (!_filtreCategorie ? '#fff' : 'var(--tx)') + ';font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;">' + T('cat_toutes_categories') + '</button>';

    var actif = _filtreCategorie === cat;
    return '<button onclick="filtrerParCategorie(' + jsAttr(cat) + ')" style="padding:6px 14px;border-radius:20px;border:1px solid ' + (actif ? 'var(--ac)' : 'var(--brd)') + ';background:' + (actif ? 'var(--ac)' : 'transparent') + ';color:' + (actif ? '#fff' : 'var(--tx)') + ';font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;">' + escHtml(cat) + '</button>';

  var selectTri =

      '<option value="pertinence"' + (_triActif === 'pertinence' ? ' selected' : '') + '>' + T('cat_tri_pertinence') + '</option>' +
      '<option value="prix_asc"' + (_triActif === 'prix_asc' ? ' selected' : '') + '>' + T('cat_tri_prix_asc') + '</option>' +
      '<option value="prix_desc"' + (_triActif === 'prix_desc' ? ' selected' : '') + '>' + T('cat_tri_prix_desc') + '</option>' +
    '</select>';
  var lib = LIBELLES_VUE[AT_LANG] || LIBELLES_VUE.fr;
  var boutonVue = function(v, glyphe) {
    return '<button class="btn-vue' + (_vueGrille === v ? ' actif' : '') + '" onclick="changerVue(' + jsAttr(v) + ')" title="' + escHtml(lib[v]) + '" aria-label="' + escHtml(lib[v]) + '" aria-pressed="' + (_vueGrille === v) + '">' + glyphe + '</button>';
  };
  var selecteurVue = '<div style="display:flex;">' + boutonVue('petites', '⊞') + boutonVue('grandes', '▢') + boutonVue('liste', '☰') + '</div>';

      '<div style="display:flex;align-items:center;gap:10px;">' + selecteurVue + selectTri + '</div>' +
    '</div>';
}

function filtrerParCategorie(cat) {
  _filtreCategorie = cat;
  renderBarreFiltres();
  rerenderGrillePrincipale();
}

function changerTri(valeur) {
  _triActif = valeur;
  rerenderGrillePrincipale();
}

function rerenderGrillePrincipale() {
  var liste = _filtreCategorie
    ? DATA.produits.filter(function(p) { return p.categorie === _filtreCategorie; })
    : DATA.produits.slice();

  if (_triActif === 'prix_asc') {
    liste.sort(function(a, b) { return (prixEffectifProduit(a) ?? Infinity) - (prixEffectifProduit(b) ?? Infinity); });
  } else if (_triActif === 'prix_desc') {
    liste.sort(function(a, b) { return (prixEffectifProduit(b) ?? -Infinity) - (prixEffectifProduit(a) ?? -Infinity); });
  } else {
    // Pertinence : produits phares en tête, comme le tri par défaut d'origine.
    var phares = liste.filter(function(p) { return p.est_phare; });
    var idsPhares = {}; phares.forEach(function(p) { idsPhares[p.id] = true; });
    var reste = liste.filter(function(p) { return !idsPhares[p.id]; });
    liste = phares.concat(reste);
  }

  var grille = document.getElementById('grille-principale');
  grille.className = 'grille' + (_vueGrille === 'petites' ? ' vue-petites' : (_vueGrille === 'liste' ? ' vue-liste' : ''));
  grille.innerHTML = liste.length
    ? (_BADGES_PRESENTS = liste.some(function(p) { return p.est_nouveaute || p.est_phare || p.promo_pct; }), liste.map(carteProduit).join(''))
    : '<p style="grid-column:1/-1;color:var(--mu);padding:30px 0;text-align:center;">' + T('cat_aucun_produit_categorie') + '</p>';
}

function changerLangueCatalogue(code) {
  AT_LANG = code;
  localStorage.setItem('at_lang', code);
  if (DATA) render();
  if (typeof appliquerTraductionsStatiques === 'function') appliquerTraductionsStatiques();
  renderPanier();
  majBadgePanier();
}

  var nom = DATA.artisan.nom_entreprise, url = urlBoutiquePartage(), texte = T('partage_boutique_1') + nom + T('partage_texte_2');
  if (navigator.share) {
    try { await navigator.share({ title: nom, text: texte, url: url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; /* le client a refermé le menu : rien à faire ; autre échec : on propose la fenêtre */ }
  }
  ouvrirMenuPartage(url, texte, nom, T('partage_titre_boutique'));
}
function ouvrirMenuPartage(url, texte, nom, titreMenu) {
  var div = document.getElementById('modal-partage');
  if (!div) { div = document.createElement('div'); div.id = 'modal-partage'; document.body.appendChild(div); }
  var bouton = 'display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid var(--line,#ddd);border-radius:10px;background:transparent;color:inherit;font-family:inherit;font-size:14px;cursor:pointer;text-decoration:none;';
  // Le nom de l'artisan n'est JAMAIS inséré comme du code : seulement via textContent / encodeURIComponent, après coup.
  div.innerHTML =
    '<div onclick="fermerMenuPartage(event)" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10020;display:flex;align-items:center;justify-content:center;padding:12px;">' +
      '<div style="background:var(--panel,#fff);border-radius:14px;padding:22px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><div style="font-weight:700;font-size:16px;">' + (titreMenu || T('partage_titre')) + '</div>' +
        '<button type="button" onclick="fermerMenuPartage({target:this,currentTarget:this})" aria-label="' + escHtml(T('partage_fermer')) + '" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--mu,#999);">✕</button></div>' +
        '<div id="partage-nom" style="font-size:13px;color:var(--mu2,#777);margin-bottom:12px;"></div>' +
        '<input id="partage-url" readonly onclick="this.select()" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:8px;font-size:13px;margin-bottom:10px;font-family:inherit;background:transparent;color:inherit;">' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          '<button type="button" id="partage-copier" onclick="copierLienPartage()" style="' + bouton + '">📋 ' + T('partage_copier') + '</button>' +
          '<a id="partage-whatsapp" target="_blank" rel="noopener noreferrer" style="' + bouton + '">💬 ' + T('partage_whatsapp') + '</a>' +
          '<a id="partage-facebook" target="_blank" rel="noopener noreferrer" style="' + bouton + '">📘 ' + T('partage_facebook') + '</a>' +
          '<a id="partage-email" style="' + bouton + '">✉️ ' + T('partage_email') + '</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById('partage-nom').textContent = nom;
  document.getElementById('partage-url').value = url;
  document.getElementById('partage-whatsapp').href = 'https://wa.me/?text=' + encodeURIComponent(texte + ' ' + url);
  document.getElementById('partage-facebook').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
  document.getElementById('partage-email').href = 'mailto:?subject=' + encodeURIComponent(nom) + '&body=' + encodeURIComponent(texte + '\n\n' + url);
}
async function copierLienPartage() {
  var champ = document.getElementById('partage-url'), bouton = document.getElementById('partage-copier');
  if (!champ || !bouton) return;
  var ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(champ.value); ok = true; } } catch (e) { /* on essaie l'autre méthode */ }
  if (!ok) { champ.focus(); champ.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } }
  var avant = bouton.innerHTML;
  bouton.textContent = ok ? T('partage_lien_copie') : T('partage_copie_manuelle');
  setTimeout(function() { if (document.getElementById('partage-copier') === bouton) bouton.innerHTML = avant; }, 2200);
}
function fermerMenuPartage(e) { if (e && e.target !== e.currentTarget) return; var d = document.getElementById('modal-partage'); if (d) d.innerHTML = ''; }


function afficherBoutiqueBientot(a) {
  a = a || {};
  document.getElementById('racine').innerHTML = '<div class="etat-page"><div style="font-size:42px;margin-bottom:10px;">🛍️</div><h1>' + T('cat_bientot_titre') + '</h1>' +
    '<p><strong>' + escHtml(a.nom_entreprise || '') + '</strong>' + (a.commune ? ' — ' + escHtml(a.commune) : '') + '</p>' +
    '<p>' + T('cat_bientot_texte') + '</p>' +
    (a.id ? '<p style="margin-top:18px;"><a href="/artisans/?artisan=' + encodeURIComponent(a.id) + '" style="color:var(--ac,#B5502F);font-weight:700;text-decoration:none;">' + T('cat_bientot_fiche') + '</a></p>' : '') +
  '</div>';
}

function afficherBoutiquePause(a) {
  a = a || {};
  document.getElementById('racine').innerHTML = '<div class="etat-page"><div style="font-size:42px;margin-bottom:10px;">⏸️</div><h1>' + T('cat_pause_titre') + '</h1>' +
    '<p><strong>' + escHtml(a.nom_entreprise || '') + '</strong>' + (a.commune ? ' — ' + escHtml(a.commune) : '') + '</p>' +
    '<p>' + T('cat_pause_texte') + '</p>' +
    (a.id ? '<p style="margin-top:18px;"><a href="/artisans/?artisan=' + encodeURIComponent(a.id) + '" style="color:var(--ac,#B5502F);font-weight:700;text-decoration:none;">' + T('cat_bientot_fiche') + '</a></p>' : '') +
  '</div>';
}

(async function init() {
  chargerPanierSession();
  majBadgePanier();
  var slug = new URLSearchParams(location.search).get('s');
  if (!slug) {
    document.getElementById('racine').innerHTML = '<div class="etat-page"><h1>' + T('cat_lien_invalide') + '</h1><p>' + T('cat_lien_incomplet') + '</p></div>';
    return;
  }
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/lire-catalogue?s=' + encodeURIComponent(slug), {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON },
    });
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    // Boutique fermée : les paiements en ligne de l'artisan ne sont pas actifs (règle du 06/10) — rien n'est commandable.
    if (data.boutique_en_pause === true) { afficherBoutiquePause(data.artisan); return; }
    if (data.boutique_ouverte === false) { afficherBoutiqueBientot(data.artisan); return; }
    DATA = data;
    render();
  } catch (e) {
    document.getElementById('racine').innerHTML = '<div class="etat-page"><h1>' + T('cat_boutique_introuvable') + '</h1><p>' + escHtml(e.message) + '</p></div>';
  }
})();
</script>
